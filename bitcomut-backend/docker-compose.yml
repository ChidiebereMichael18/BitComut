version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: bitpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitpulse
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: bitpulse
    ports:
      - "5432:5432"
    volumes:
      - bitpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bitpulse_pgdata:
